<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extreme Sports Gear Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Extreme Sports Gear Shop</h1>
    <div class="cart-controls">
      <button id="cart-btn" class="btn">
        <span id="show-hide-cart">Show</span> Cart 
        (<span id="total-items">0</span>)
      </button>
    </div>
  </header>

  <main>
    <div id="cart-container" class="cart-container" style="display: none;">
      <h2>Your Cart</h2>
      <button id="clear-cart-btn" class="btn clear-btn">Clear Cart</button>
      <div id="products-container" class="products-container"></div>
      <div class="cart-totals">
        <p>Subtotal: <span id="subtotal">0</span></p>
        <p>Taxes: <span id="taxes">0</span></p>
        <p>Total: <span id="total">0</span></p>
      </div>
    </div>

    <!-- The JS expects this ID for the product grid -->
    <div id="dessert-card-container" class="products-grid"></div>
  </main>

  <script src="shoping-cart.js"></script>
</body>
</html>
