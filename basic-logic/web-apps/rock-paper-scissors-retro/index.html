<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS - RETRO</title>
    <!-- Using a pixelated font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="screen-overlay"></div>
    <div class="game-container">
        <h1>BATTLE!</h1>
        
        <div class="scoreboard">
            <div class="stat">
                P1: <span id="player-score">0</span>
            </div>
            <div class="stat">
                CPU: <span id="computer-score">0</span>
            </div>
        </div>

        <div class="display-area">
            <p id="results-msg">INSERT COIN...</p>
        </div>

        <div id="controls" class="controls">
            <button id="rock-btn" class="pixel-btn">ROCK</button>
            <button id="paper-btn" class="pixel-btn">PAPER</button>
            <button id="scissors-btn" class="pixel-btn">SCISSOR</button>
        </div>

        <div id="game-over" class="game-over">
            <h2 id="winner-msg">WINNER!</h2>
            <button id="reset-game-btn" class="pixel-btn reset">RETRY?</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
