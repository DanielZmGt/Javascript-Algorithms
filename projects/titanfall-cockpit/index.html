<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titanfall Cockpit</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="boot-screen">
        <div style="width: 300px;">
            <p>> NEURAL LINK INITIALIZING...</p>
            <div style="width:100%; background:#111; height:4px;"><div class="progress"></div></div>      
        </div>
    </div>

    <div id="cockpit-container">
        <div class="glare"></div>
        <div class="cockpit-frame top"></div>
        <div class="cockpit-frame left-pillar"></div>
        <div class="cockpit-frame right-pillar"></div>
        <div class="cockpit-frame bottom-console">
             <div style="width: 100px; height: 80px; background: #111; border: 2px solid #333; position: relative;">
                <div style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 20px; height: 40px; background: #222; border-radius: 5px;"></div>
             </div>
        </div>

        <div class="hud-panel" style="align-self: flex-start;">
            <p>TITAN STATUS</p>
            <div style="width:100%; height:8px; border:1px solid var(--cyan);"><div style="width:80%; height:100%; background:var(--orange);"></div></div>
            <p style="font-size:10px; margin-top:20px;">> PROTOCOL 3: PROTECT PILOT</p>
        </div>

        <div style="flex-grow:1; display:flex; flex-direction:column; justify-content:center; align-items:center;">
            <div class="crosshair"></div>
            <div class="core-percent" id="core">READY</div>
        </div>

        <div class="hud-panel" style="align-self: flex-start; text-align: right;">
            <p id="clock">00:00</p>
            <p style="font-size:10px;">SYSTEMS: NOMINAL</p>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
