<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Madrid - UCL 2024 Champions</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="images/logos/real-madrid.svg" alt="Real Madrid Logo" class="logo">
            <div class="header-text">
                <h1 id="team"></h1>
                <p>Champions League Winners <span id="year"></span></p>
                <p>Coach: <span id="head-coach"></span></p>
            </div>
            <img src="images/logos/ucl.svg" alt="UCL Logo" class="logo ucl-logo">
        </div>
    </header>

    <section class="controls">
        <label for="players">Filter Squad:</label>
        <select id="players">
            <option value="all">Full Squad</option>
            <option value="forward">Forwards</option>
            <option value="midfielder">Midfielders</option>
            <option value="defender">Defenders</option>
            <option value="goalkeeper">Goalkeepers</option>
        </select>
    </section>

    <main id="player-cards" class="cards-grid"></main>

    <script src="script.js"></script>
</body>
</html>
